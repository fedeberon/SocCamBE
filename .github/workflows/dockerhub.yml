name: Backend CI + Auto Deploy VPS

on:
  push:
    branches:
      - release
  workflow_dispatch:

env:
  DOCKER_IMAGE: fedeberon/soccam-be
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test (non-blocking)
        run: npm test -- --passWithNoTests || true

  build-and-push:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect non-test changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            deploy:
              - '!tests/**'
              - '!tests/**/__snapshots__/**'
              - '!**/*.test.*'
              - '!**/*.spec.*'
              - '!**/__snapshots__/**'
              - '!**/*.snap'

      - name: Log context
        if: steps.changes.outputs.deploy == 'true'
        run: |
          echo "::notice::Branch: ${{ github.ref }}"
          echo "::notice::Commit: ${{ github.sha }}"
          echo "::notice::Target image: ${{ env.DOCKER_IMAGE }}"

      - name: Set up Docker Buildx
        if: steps.changes.outputs.deploy == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        if: steps.changes.outputs.deploy == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.changes.outputs.deploy == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          push: true

      - name: Log publish result
        if: steps.changes.outputs.deploy == 'true'
        run: |
          echo "::notice::Published tags: ${{ env.DOCKER_IMAGE }}:latest y ${{ env.DOCKER_IMAGE }}:${{ github.sha }}"
          echo "::notice::Workflow run: ${{ github.run_id }}"

      - name: Skip publish (tests only)
        if: steps.changes.outputs.deploy != 'true'
        run: |
          echo "::notice::Docker publish skipped: only test changes detected."

  deploy-vps:
    runs-on: ubuntu-latest
    needs: [ci, build-and-push]
    environment: production
    steps:
      - name: Verify required VPS/DockerHub values
        id: verify
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_APP_PATH: ${{ vars.VPS_APP_PATH }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${VPS_HOST}" ] || [ -z "${VPS_USER}" ] || [ -z "${VPS_PASSWORD}" ] || [ -z "${VPS_APP_PATH}" ] || [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Faltan valores de deploy (vars: VPS_HOST/VPS_USER/VPS_APP_PATH, secrets: VPS_PASSWORD/DOCKERHUB_USERNAME/DOCKERHUB_TOKEN). VPS_SSH_PORT es opcional (default 22)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy backend images on VPS (Docker only)
        if: ${{ steps.verify.outputs.ready == 'true' }}
        uses: appleboy/ssh-action@v1.0.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ vars.VPS_HOST }}
          port: ${{ vars.VPS_SSH_PORT || 22 }}
          username: ${{ vars.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -euo pipefail

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            cd "${{ vars.VPS_APP_PATH }}"
            docker-compose pull backend backend-worker
            docker rm -f backend backend-worker || true
            docker-compose up -d --force-recreate --no-deps backend backend-worker

      - name: Log deployment done
        if: ${{ steps.verify.outputs.ready == 'true' }}
        run: echo "::notice::Backend Docker deploy triggered on host ${{ vars.VPS_HOST }} by ${{ github.actor }}"
