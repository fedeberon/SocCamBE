name: Backend CI + Auto Deploy VPS

on:
  push:
    branches:
      - release

env:
  DOCKER_IMAGE: fedeberon/soccam-be
  MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
  MP_NOTIFICATION_URL: ${{ secrets.MP_NOTIFICATION_URL }}
  MP_SUCCESS_URL: ${{ secrets.MP_SUCCESS_URL }}
  MP_FAILURE_URL: ${{ secrets.MP_FAILURE_URL }}
  MP_SUCCESS_REDIRECT: ${{ secrets.MP_SUCCESS_REDIRECT }}
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test (if present)
        run: npm test -- --passWithNoTests

  deploy-vps:
    runs-on: ubuntu-latest
    needs: ci
    if: ${{ env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != '' && env.VPS_APP_PATH != '' }}
    steps:
      - name: Deploy API + Worker on VPS (systemd)
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${VPS_APP_PATH}"

            echo "[deploy] updating release branch..."
            git fetch --all --prune
            git checkout release
            git pull --ff-only origin release

            if [ ! -f .env ]; then
              echo "ERROR: falta .env en VPS_APP_PATH (${VPS_APP_PATH})."
              echo "Crealo en la VPS con las variables productivas y reintentá."
              exit 1
            fi

            echo "[deploy] deploy API service"
            sudo APP_DIR="${VPS_APP_PATH}" APP_USER="${VPS_USER}" APP_GROUP="${VPS_USER}" bash scripts/deploy-api.sh

            echo "[deploy] deploy worker service"
            sudo APP_DIR="${VPS_APP_PATH}" APP_USER="${VPS_USER}" APP_GROUP="${VPS_USER}" bash scripts/deploy-sos-worker.sh

            echo "[deploy] service status"
            sudo systemctl --no-pager --full status soccambe-api || true
            sudo systemctl --no-pager --full status soccambe-sos-worker || true
