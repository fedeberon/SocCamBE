name: Push Docker Image to DockerHub

on:
  push:
    branches:
      - release

env:
  DOCKER_IMAGE: fedeberon/soccam-be
  MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
  MP_NOTIFICATION_URL: ${{ secrets.MP_NOTIFICATION_URL }}
  MP_SUCCESS_URL: ${{ secrets.MP_SUCCESS_URL }}
  MP_FAILURE_URL: ${{ secrets.MP_FAILURE_URL }}
  MP_SUCCESS_REDIRECT: ${{ secrets.MP_SUCCESS_REDIRECT }}
  AZURE_STORAGE_CONNECTION: ${{ secrets.AZURE_STORAGE_CONNECTION }}
  AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: AZURE_STORAGE_CONNECTION
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log environment context
        run: |
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Docker image: ${{ env.DOCKER_IMAGE }}"
          if [ -n "${MP_ACCESS_TOKEN:-}" ]; then
            echo "MP_ACCESS_TOKEN is present (hidden for security)."
          else
            echo "WARNING: MP_ACCESS_TOKEN is not set."
          fi
          if [ -n "${AZURE_STORAGE_CONNECTION:-}" ]; then
            echo "AZURE_STORAGE_CONNECTION is present (hidden for security)."
          else
            echo "WARNING: AZURE_STORAGE_CONNECTION is not set."
          fi
          echo "VPS deploy enabled?: ${{ env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != '' && env.VPS_APP_PATH != '' }}"

      - name: Validate required secrets
        run: |
          set -euo pipefail
          missing=0
          for key in MP_ACCESS_TOKEN AZURE_STORAGE_CONNECTION VPS_HOST VPS_USER VPS_SSH_KEY VPS_APP_PATH; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required secret/env: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: fedeberon
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push the Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          push: true
          provenance: false

      - name: Show docker images (post-build)
        run: docker images | head

      - name: Copy docker-compose to VPS
        if: ${{ env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != '' && env.VPS_APP_PATH != '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: "${{ env.VPS_APP_PATH }}/"

      - name: Deploy on VPS
        if: ${{ env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != '' && env.VPS_APP_PATH != '' }}
        uses: appleboy/ssh-action@v0.1.10
        env:
          MP_ACCESS_TOKEN: ${{ env.MP_ACCESS_TOKEN }}
          MP_NOTIFICATION_URL: ${{ env.MP_NOTIFICATION_URL }}
          MP_SUCCESS_URL: ${{ env.MP_SUCCESS_URL }}
          MP_FAILURE_URL: ${{ env.MP_FAILURE_URL }}
          MP_SUCCESS_REDIRECT: ${{ env.MP_SUCCESS_REDIRECT }}
          AZURE_STORAGE_CONNECTION: ${{ env.AZURE_STORAGE_CONNECTION }}
          AZURE_STORAGE_CONTAINER: ${{ env.AZURE_STORAGE_CONTAINER }}
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${VPS_APP_PATH}"

            cat > .env <<EOF
            MP_ACCESS_TOKEN=${MP_ACCESS_TOKEN}
            MP_NOTIFICATION_URL=${MP_NOTIFICATION_URL}
            MP_SUCCESS_URL=${MP_SUCCESS_URL}
            MP_FAILURE_URL=${MP_FAILURE_URL}
            MP_SUCCESS_REDIRECT=${MP_SUCCESS_REDIRECT}
            AZURE_STORAGE_CONNECTION=${AZURE_STORAGE_CONNECTION}
            AZURE_STORAGE_CONTAINER=${AZURE_STORAGE_CONTAINER:-socios-assets}
            PORT=5000
            EOF

            echo "docker compose pull..."
            docker compose pull
            echo "docker compose up -d..."
            docker compose up -d
            echo "docker ps..."
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'

            echo "docker image prune -f..."
            docker image prune -f
