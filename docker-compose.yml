services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      AZURE_STORAGE_CONNECTION: ${AZURE_STORAGE_CONNECTION}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-socios-assets}
    ports:
      - "${PORT:-5000}:5000"
    restart: unless-stopped
